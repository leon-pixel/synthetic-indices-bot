name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Smoke backtest (sample ticks)
        run: python -m sidx.research.run_backtest --csv testdata/sample_ticks.csv --out-dir reports/ci
